version: "3.9"

services:
  nanolab-glp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nanolab-glp-production
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - ENV=production
      - APP_ENV=production
      - DATABASE_URL=sqlite:////app/backend/data/nanolab_glp.db
      - UPLOAD_DIR=/app/backend/uploads
    volumes:
      # SQLite WAL veritabanı ve yüklenen PDF/Excel belgeleri için kalıcı (persistent) disk alanları
      - ./backend/nanolab_glp.db:/app/backend/nanolab_glp.db
      - ./backend/uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
